<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Trading Channels</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Telegram Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            z-index: 1;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #0088cc, #00ff88);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            color: white;
            box-shadow: 0 0 30px rgba(0, 136, 204, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s ease;
        }

        .link-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #0088cc;
            background: rgba(0, 136, 204, 0.1);
            box-shadow: 0 15px 30px rgba(0, 136, 204, 0.2);
        }

        .link-card:hover::before {
            left: 100%;
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .icon-box {
            width: 45px;
            height: 45px;
            background: #0088cc;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .text-info {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
        }

        .join-btn {
            background: #ffffff;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .link-card:hover .join-btn {
            background: #0088cc;
            color: white;
        }

        /* Unique Badges & Animations */
        .badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            width: fit-content;
        }

        .cricket-badge { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #34d399;}
        .fno-badge { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #fbbf24;}
        .earn-badge { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid #f472b6; animation: pulse 2s infinite;}

        /* Keyframe Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(244, 114, 182, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0); }
        }

        /* Particle Background */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
            animation: move-bg 100s linear infinite;
        }

        @keyframes move-bg {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

    </style>
</head>
<body>
    <div class="particles"></div>
    <div class="container">
        <!-- Logo/Profile Area -->
        <div class="profile-img">
            <i class="fa-brands fa-telegram"></i>
        </div>
        
        <h1>Join Elite Communities</h1>
        <p class="subtitle">Click on any channel below to join instantly</p>

        <div class="links-wrapper">
            
            <!-- Link 1: Cricket Trading -->
            <a href="https://t.me/+KDlKzC3Z3oRhYzA1" target="_blank" class="link-card">
                <div class="card-content">
                    <div class="icon-box"><i class="fa-solid fa-bolt"></i></div>
                    <div class="text-info">
                        <span class="title">Cricket Trading</span>
                        <span class="badge cricket-badge">98% Accuracy 🔥</span>
                    </div>
                </div>
                <div class="join-btn">Join <i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- Link 2: F&O Trading -->
            <a href="https://t.me/+vXrRbWip1GNmZGE1" target="_blank" class="link-card">
                <div class="card-content">
                    <div class="icon-box" style="background: #f59e0b;"><i class="fa-solid fa-chart-line"></i></div>
                    <div class="text-info">
                        <span class="title">F&O Trading</span>
                        <span class="badge fno-badge">Premium Calls 📊</span>
                    </div>
                </div>
                <div class="join-btn">Join <i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- Link 3: Earn Daily Free -->
            <a href="https://t.me/+_alsgZEfYkU3YWZl" target="_blank" class="link-card" style="border: 1px solid rgba(236,72,153,0.3);">
                <div class="card-content">
                    <div class="icon-box" style="background: #ec4899;"><i class="fa-solid fa-wallet"></i></div>
                    <div class="text-info">
                        <span class="title">Earn ₹200-400 Daily</span>
                        <span class="badge earn-badge">100% Free 💰</span>
                    </div>
                </div>
                <div class="join-btn">Join <i class="fa-solid fa-arrow-right"></i></div>
            </a>

        </div>
    </div>
</body>
</html>
